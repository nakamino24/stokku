name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 8.6.0
  DATABASE_URL: postgresql://stokku:stokku@localhost:5432/stokku-test
  DIRECT_URL: postgresql://stokku:stokku@localhost:5432/stokku-test
  API_ORIGIN: http://127.0.0.1:3001
  ACCESS_TOKEN_SECRET: ci-only-access-token-secret-at-least-32-characters

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Validate Prisma schema
        run: pnpm --filter @stokku/database exec prisma validate

      - name: Typecheck workspace
        run: pnpm typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stokku
          POSTGRES_PASSWORD: stokku
          POSTGRES_DB: stokku-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @stokku/database exec prisma generate

      - name: Run Prisma Migrations
        run: pnpm --filter @stokku/database exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed Database
        run: pnpm --filter @stokku/database exec prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Inventory Domain & Reconciliation Tests
        run: pnpm --filter @stokku/api test -- --runInBand inventory.integration.test.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run API Unit Tests
        run: pnpm --filter @stokku/api test -- --runInBand --testPathIgnorePatterns=inventory.integration.test.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Database Contract Tests
        run: pnpm --filter @stokku/database test -- --runInBand

      - name: Run Web Tests
        run: pnpm --filter @stokku/web exec jest --runInBand

  render-build:
    name: Render build validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stokku
          POSTGRES_PASSWORD: stokku
          POSTGRES_DB: stokku-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @stokku/database exec prisma generate
      - name: Apply database migrations
        run: pnpm migrate:deploy
      - name: Run Render build
        run: pnpm render-build

  wms-e2e:
    name: WMS Playwright acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stokku
          POSTGRES_PASSWORD: stokku
          POSTGRES_DB: stokku-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: 3001
      API_ORIGIN: http://127.0.0.1:3001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @stokku/database exec prisma generate
      - name: Apply database migrations
        run: pnpm migrate:deploy
      - name: Seed disposable database
        run: pnpm --filter @stokku/database exec prisma db seed
      - name: Build database and API runtime packages
        run: pnpm --filter @stokku/database build && pnpm --filter @stokku/api build
      - name: Install Playwright Chromium
        run: pnpm --filter @stokku/web exec playwright install --with-deps chromium
      - name: Run WMS acceptance specs
        run: pnpm --filter @stokku/web test:e2e -- e2e/purchase-order-workflow.spec.ts e2e/sales-order-workflow.spec.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build Docker image (API)
        run: docker build --target api -t stokku/api:ci .

      - name: Build Docker image (Web)
        run: docker build --target web -t stokku/web:ci .
