services:
  - type: web
    name: stokku-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: .

    buildCommand: corepack enable && corepack prepare pnpm@8.6.0 --activate && pnpm install --frozen-lockfile && pnpm render-build
    startCommand: node apps/api/dist/server.js

    healthCheckPath: /health
    autoDeployTrigger: checksPass

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: 22.22.0

      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: ACCESS_TOKEN_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        sync: false

      - key: APP_URL
        sync: false

      - key: LOG_LEVEL
        value: info