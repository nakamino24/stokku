name: stokku

services:
  api:
    build:
      context: .
      target: api
      cache_from:
        - stokku-api:latest
    container_name: stokku-api
    ports:
      - "${API_PORT:-4000}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      EMAIL_OUTBOX_ENCRYPTION_KEY: ${EMAIL_OUTBOX_ENCRYPTION_KEY:?EMAIL_OUTBOX_ENCRYPTION_KEY is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      APP_URL: ${APP_URL:?APP_URL is required}
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      cache_from:
        - stokku-web:latest
    container_name: stokku-web
    ports:
      - "${WEB_PORT:-3000}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      API_ORIGIN: ${API_ORIGIN:?API_ORIGIN is required}
    depends_on: [api]
    restart: unless-stopped
